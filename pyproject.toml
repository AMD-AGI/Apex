[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amd-apex-optimizer"
version = "0.1.0"
description = "Evidence-driven RL environment for AMD GPU kernel optimization"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = [
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "tools/perf_knowledge/LICENSE.upstream",
]
authors = [{ name = "Advanced Micro Devices, Inc." }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
apex = "apex.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"apex.knowledge" = [
  "data/cards.json",
  "data/LICENSE.GEAK-Apache-2.0",
  "data/THIRD_PARTY_NOTICES.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: requires an AMD GPU",
  "live: invokes a real agent or external workload",
  "integration: crosses module or process boundaries",
]
